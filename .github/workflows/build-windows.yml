name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Smoke test UI and runtime
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python app.py --smoke-test

      - name: Test FFmpeg runtime
        shell: pwsh
        run: |
          @'
          import os
          import subprocess
          import imageio_ffmpeg
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          assert os.path.isfile(ffmpeg), ffmpeg
          subprocess.check_call([ffmpeg, '-hide_banner', '-version'])
          print('FFmpeg runtime OK:', ffmpeg)
          '@ | Set-Content -Encoding utf8 test_ffmpeg_runtime.py
          python test_ffmpeg_runtime.py

      - name: Test yt-dlp browser impersonation
        shell: pwsh
        run: |
          @'
          from yt_dlp import YoutubeDL
          from yt_dlp.networking.impersonate import ImpersonateTarget

          with YoutubeDL({'quiet': True, 'no_warnings': True}) as ydl:
              assert ydl._impersonate_target_available(ImpersonateTarget()), 'No curl_cffi impersonation target is available'
              print('Available impersonation backend: OK')
          '@ | Set-Content -Encoding utf8 test_impersonation.py
          python test_impersonation.py

      - name: Test UI at 125 percent
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_SCALE_FACTOR = '1.25'
          python app.py --smoke-test

      - name: Test UI at 150 percent and render preview
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_SCALE_FACTOR = '1.5'
          @'
          import importlib.util
          from PySide6.QtWidgets import QApplication
          from PySide6.QtGui import QPixmap

          spec = importlib.util.spec_from_file_location('appmod', 'app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          app = QApplication.instance() or QApplication([])
          w = mod.MainWindow()
          w.theme_mode = 'light'
          w.apply_theme()
          w.resize(960, 690)
          w.show()
          app.processEvents()
          app.processEvents()

          assert w.url_edit.height() >= 42
          assert w.path_edit.height() >= 42
          assert w.download_btn.height() >= 42
          assert w.quality_combo.height() >= 42

          pix = QPixmap(w.size())
          w.render(pix)
          assert pix.save('ui-preview-150pct.png')
          print('150% UI geometry OK')
          w.close()
          '@ | Set-Content -Encoding utf8 test_ui_preview.py
          python test_ui_preview.py

      - name: Test UI at 200 percent
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_SCALE_FACTOR = '2.0'
          python app.py --smoke-test

      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-MP4-Downloader-UI-preview
          path: ui-preview-150pct.png
          if-no-files-found: error
          retention-days: 7

      - name: Create Windows icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw

          im = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((12, 12, 244, 244), radius=58, fill=(255, 0, 0, 255))
          d.polygon([(103, 78), (103, 178), (181, 128)], fill='white')
          im.save('app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 make_icon.py
          python make_icon.py

      - name: Create Windows version metadata
        shell: pwsh
        run: |
          @'
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(1,0,0,0), prodvers=(1,0,0,0), mask=0x3f,
              flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)
            ),
            kids=[
              StringFileInfo([StringTable(u'040904B0', [
                StringStruct(u'CompanyName', u'WenZurich'),
                StringStruct(u'FileDescription', u'YouTube MP4 Downloader'),
                StringStruct(u'FileVersion', u'1.0.0'),
                StringStruct(u'InternalName', u'YouTube MP4 Downloader'),
                StringStruct(u'OriginalFilename', u'YouTube MP4 Downloader.exe'),
                StringStruct(u'ProductName', u'YouTube MP4 Downloader'),
                StringStruct(u'ProductVersion', u'1.0.0')
              ])]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          '@ | Set-Content -Encoding utf8 version_info.txt

      - name: Build single-file Windows app
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "YouTube MP4 Downloader" `
            --icon app.ico `
            --version-file version_info.txt `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --collect-all curl_cffi `
            --collect-all cffi `
            app.py

      - name: Verify EXE exists and metadata
        shell: pwsh
        run: |
          $exe = 'dist\YouTube MP4 Downloader.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not produced.' }
          $item = Get-Item $exe
          $v = $item.VersionInfo
          if ($v.ProductName -ne 'YouTube MP4 Downloader') { throw "Unexpected ProductName: $($v.ProductName)" }
          if ($v.CompanyName -ne 'WenZurich') { throw "Unexpected CompanyName: $($v.CompanyName)" }
          $item | Format-List Name,Length,LastWriteTime
          $v | Format-List CompanyName,ProductName,FileDescription,FileVersion,ProductVersion

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath 'dist\YouTube MP4 Downloader.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged EXE smoke test failed with exit code $($p.ExitCode)" }

      - name: Generate SHA256
        shell: pwsh
        run: |
          Get-FileHash 'dist\YouTube MP4 Downloader.exe' -Algorithm SHA256 |
            Format-List |
            Out-File -Encoding utf8 'dist\SHA256.txt'

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-MP4-Downloader-Windows-x64-v1.0.0
          path: |
            dist/YouTube MP4 Downloader.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
